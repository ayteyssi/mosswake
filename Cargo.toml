[workspace]
resolver = "2"
members = ["crates/*", "bins/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ayteyssi/mosswake"

# Shared dependency versions live in [workspace.dependencies]; crates opt in with
# `foo.workspace = true`. Add entries only when a crate actually uses them (cargo warns
# about unused ones). Internal crates: `mw_core = { path = "crates/mw_core" }`, etc.
# Before adding a dependency, check version compatibility (e.g. bevy_egui <-> bevy).
[workspace.dependencies]
# Bevy: headless crates (mw_sim) use no default features; client crates opt into rendering features.
bevy = { version = "0.20.1", default-features = false }
# Same major version as Bevy's own `image` dependency (bevy_image), so it is shared.
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Networking (mw_net): transport-agnostic core + netcode UDP transport, compact serde codec.
renet = "2.0.1"
renet_netcode = "2.0.1"
postcard = { version = "1.2.0", features = ["use-std"] }
thiserror = "2.0.21"
# Scripting (sandboxed by construction): `sync` so the engine can live in a Bevy resource;
# `no_time` removes wall-clock functions and `no_module` removes `import` / file access;
# no default features so internal hashing uses no OS randomness (`ahash/runtime-rng`).
rhai = { version = "1.27.0", default-features = false, features = ["std", "sync", "no_time", "no_module"] }
# Binaries only (libraries use thiserror).
anyhow = "1.0.105"
rmcp = { version = "3.12.0", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "io-std"] }
tempfile = "3.27.0"
mw_core = { path = "crates/mw_core" }
mw_level = { path = "crates/mw_level" }
mw_net = { path = "crates/mw_net" }
mw_sim = { path = "crates/mw_sim" }
mw_render = { path = "crates/mw_render" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
# No debug info for dependencies: with Bevy it dominates build size (disk) and link time,
# and we rarely step into engine code. Our own crates keep full debug info.
debug = false
